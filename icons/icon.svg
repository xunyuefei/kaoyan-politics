<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Revolutionary Crimson Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Indigo Cyan Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer border ring -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#centerGlow)"/>

  <!-- 经纬仪 / Coordinate Grid Lines -->
  <!-- Latitude Ellipses -->
  <ellipse cx="256" cy="256" rx="170" ry="170" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2.5"/>
  <ellipse cx="256" cy="256" rx="170" ry="105" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="6 4"/>
  <ellipse cx="256" cy="256" rx="170" ry="45" fill="none" stroke="rgba(99,102,241,0.35)" stroke-width="2"/>
  
  <!-- Longitude Lines -->
  <line x1="86" y1="256" x2="426" y2="256" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <line x1="256" y1="86" x2="256" y2="426" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <ellipse cx="256" cy="256" rx="75" ry="170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Orbital Inclined Ring (经纬光环) -->
  <g transform="rotate(-28 256 256)">
    <ellipse cx="256" cy="256" rx="195" ry="60" fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#neonGlow)"/>
    <ellipse cx="256" cy="256" rx="195" ry="60" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.75"/>
    <circle cx="61" cy="256" r="7" fill="#fbbf24" filter="url(#dropShadow)"/>
    <circle cx="451" cy="256" r="7" fill="#fbbf24" filter="url(#dropShadow)"/>
  </g>

  <!-- Central Badge (革命星芒 + 经纬徽章) -->
  <g filter="url(#dropShadow)">
    <!-- Shield / Diamond Backing -->
    <polygon points="256,140 350,256 256,372 162,256" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Inner Accent Star -->
    <!-- Chinese Character: 政 (Stylized & Clear) -->
    <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="92" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#dropShadow)">政</text>

    <!-- Top Star atop badge -->
    <polygon points="256,120 262,136 279,136 265,146 270,162 256,152 242,162 247,146 233,136 250,136" fill="url(#goldGrad)"/>
  </g>

  <!-- Bottom Subtitle / Tag: 经纬图谱 -->
  <g transform="translate(0, 420)">
    <rect x="166" y="0" width="180" height="34" rx="17" fill="rgba(15,23,42,0.85)" stroke="url(#glowGrad)" stroke-width="2"/>
    <text x="256" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">经纬图谱</text>
  </g>
</svg>
